<!DOCTYPE html>
<html lang="uz">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduHub — O'quv Markazi Platformasi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>
  <div class="grain"></div>


  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="#" class="logo" onclick="navigate('home')">
        <div class="logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
          </svg>
        </div>
        <span>EduHub</span>
      </a>
      <div class="nav-links" id="navLinks">
        <a href="#" onclick="navigate('home')" class="nav-link active" data-page="home">Bosh sahifa</a>
        <a href="#" onclick="navigate('courses')" class="nav-link" data-page="courses">Kurslar</a>
        <a href="#" onclick="navigate('admin')" class="nav-link nav-link-admin" data-page="admin">
          <span class="pulse-dot"></span>Admin
        </a>
        <div id="authNav" class="nav-auth"></div>
      </div>
      <button class="mobile-toggle" onclick="toggleMobile()" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
    </div>
  </nav>

  <main id="app"></main>

  <div id="toastContainer" class="toast-container"></div>

  <script src="app.js"></script>
</body>

</html>
